<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartTV</title><link rel="stylesheet" href="/styles.css"></head><body><canvas id="waves"></canvas><div id="glow"></div>
<header><div><div id="greet" class="caps">GOOD EVENING</div><div id="clock">--:--</div><div id="date" class="caps"></div></div><nav><button id="media" class="active">Media Mode</button><button id="dashboard">Dashboard Mode</button></nav><div class="tools"><button id="network">● Online</button><button id="stats">Pi Stats</button><button id="manage">＋ Apps</button><button id="exit" class="danger">Exit</button></div></header>
<main><section id="feature"><div id="kind" class="caps accent">MEDIA APP</div><div id="heroIcon">▶</div><h1 id="heroName">YouTube</h1><p id="heroDesc"></p><button id="heroOpen">Open app&nbsp; →</button><div class="hint">Hover to preview · Click to launch</div></section><section id="rail" aria-label="Applications"></section></main>
<div id="statsModal" class="modal hidden"><div class="panel wide"><button class="x" data-close="statsModal">×</button><h2>Raspberry Pi & SmartTV</h2><div id="statsGrid" class="stats"></div><div id="temp"></div></div></div>
<div id="networkModal" class="modal hidden"><div class="panel networkPanel"><button class="x" data-close="networkModal">×</button><h2>Network connection</h2><div id="networkGrid" class="stats two"></div></div></div>
<div id="manageModal" class="modal hidden"><div class="panel managePanel"><button class="x" data-close="manageModal">×</button><h2>Manage apps</h2><div class="manageBody"><form id="addForm"><label>Name<input id="an" required></label><label>URL<input id="au" type="url" required placeholder="https://..."></label><label>Description<textarea id="ad" rows="3"></textarea></label><div class="row"><label>Mode<select id="am"><option value="media">Media</option><option value="dashboard">Dashboard</option></select></label><label>Color<input id="ac" type="color" value="#0ea5e9"></label></div><button class="primary">Add application</button></form><div><h3>Current apps</h3><div id="manageList"></div></div></div></div></div>
<div id="toast"></div><div id="screen" class="screen hidden"><b id="screenClock"></b><span>Move the mouse to wake</span></div><script src="/app.js"></script></body></html>
