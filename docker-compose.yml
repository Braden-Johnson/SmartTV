services:
  smarttv-backend:
    build: .
    container_name: smarttv-backend
    restart: unless-stopped
    network_mode: host
    environment:
      SMARTTV_HOST_AGENT: http://127.0.0.1:8766
      GLANCES_URL: http://127.0.0.1:61208
      SMARTTV_DATA_DIR: /data
      TZ: America/New_York
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
