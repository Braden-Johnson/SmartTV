<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raspberry Pi Smart TV Launcher</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap');
    
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #080b11;
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated Canvas Backdrop replacing plain black */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* Dynamic Top Shelf Background Ambient Glow */
    #ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60vh;
      pointer-events: none;
      transition: background 0.4s ease-out;
      z-index: 1;
    }

    /* Pi-Optimized Glassmorphism */
    .glass-pill {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .glass-pill:hover, .glass-pill:focus {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.04);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      will-change: transform;
    }

    /* TV Tile Focus & Fast Performance Hover State */
    .tv-tile {
      outline: none;
      position: relative;
    }

    .tv-tile:focus, .tv-tile.active-focus, .tv-tile:hover {
      transform: translateY(-6px) scale(1.04);
      box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.7), 0 0 0 3px rgba(255, 255, 255, 0.9);
      z-index: 30;
    }

    /* Drift Screensaver Animation */
    @keyframes drift {
      0% { transform: translate(5vw, 5vh); }
      25% { transform: translate(60vw, 20vh); }
      50% { transform: translate(40vw, 60vh); }
      75% { transform: translate(10vw, 40vh); }
      100% { transform: translate(5vw, 5vh); }
    }

    .screensaver-active #screensaver {
      display: flex !important;
    }

    #screensaver-clock {
      animation: drift 35s infinite ease-in-out alternate;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-6 md:p-10 relative overflow-hidden select-none">

  <script>
    // Animated Wavy Canvas Background Logic
    function initCanvasBackground() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      let step = 0;
      function animateBg() {
        step += 0.003;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const g1 = ctx.createRadialGradient(
          canvas.width * (0.3 + 0.2 * Math.sin(step)),
          canvas.height * (0.2 + 0.2 * Math.cos(step * 0.8)),
          10,
          canvas.width * 0.5,
          canvas.height * 0.5,
          canvas.width * 0.7
        );
        g1.addColorStop(0, 'rgba(30, 27, 75, 0.45)');
        g1.addColorStop(1, 'rgba(8, 11, 17, 0)');

        const g2 = ctx.createRadialGradient(
          canvas.width * (0.7 + 0.2 * Math.cos(step * 0.9)),
          canvas.height * (0.8 + 0.15 * Math.sin(step)),
          10,
          canvas.width * 0.5,
          canvas.height * 0.5,
          canvas.width * 0.6
        );
        g2.addColorStop(0, 'rgba(15, 118, 110, 0.25)');
        g2.addColorStop(1, 'rgba(8, 11, 17, 0)');

        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        requestAnimationFrame(animateBg);
      }
      animateBg();
    }

        glow: 'rgba(240, 82, 82, 0.55)',
        bgGradient: 'bg-gradient-to-b from-rose-900 to-neutral-950',
        svg: `<svg viewBox="0 0 110 40" class="h-8 w-auto"><path fill="#F05252" d="M16 4L4 9v10c0 9 7 15 12 17 5-2 12-8 12-17V9L16 4z"/><text x="34" y="26" fill="#FFF" font-weight="800" font-size="18" font-family="Arial, sans-serif">Pi-hole</text></svg>`
      },
      {
        id: 'portainer',
        name: 'Portainer',
        url: 'http://192.168.1.150:9000',
        glow: 'rgba(13, 148, 136, 0.55)',
        bgGradient: 'bg-gradient-to-b from-teal-800 to-slate-950',
        svg: `<svg viewBox="0 0 120 40" class="h-8 w-auto"><rect x="4" y="10" width="24" height="20" rx="4" fill="#0D9488"/><text x="34" y="26" fill="#FFF" font-weight="800" font-size="17" font-family="Arial, sans-serif">Portainer</text></svg>`
      },
      {
        id: 'files',
        name: 'Local Storage / Shares',
        url: '#',
        glow: 'rgba(168, 85, 247, 0.55)',
        bgGradient: 'bg-gradient-to-b from-purple-900 to-slate-950',
        svg: `<svg viewBox="0 0 120 40" class="h-8 w-auto"><path fill="#A855F7" d="M4 10h10l4 4h12v16H4V10z"/><text x="34" y="26" fill="#FFF" font-weight="800" font-size="16" font-family="Arial, sans-serif">Storage</text></svg>`
      }
    ];

    let currentMode = 'media';
    let isEthernet = true;
    let focusableElements = [];
    let screensaverTimeout = null;
    const DEFAULT_GITHUB_RAW_URL = 'https://raw.githubusercontent.com/Braden-Johnson/SmartTV/main/raspberry_pi_smart_tv_dashboard.html';

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const formattedHours = hours % 12 || 12;

      const clockEl = document.getElementById('clock-time');
      if (clockEl) {
        clockEl.innerHTML = `${formattedHours}:${minutes}<span class="text-2xl font-light text-slate-400 ml-1">${ampm}</span>`;
      }

      const dateEl = document.getElementById('clock-date');
      if (dateEl) {
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        dateEl.innerText = now.toLocaleDateString('en-US', options).toUpperCase();
      }

      const screensaverTime = document.getElementById('screensaver-time');
      if (screensaverTime) {
        screensaverTime.innerText = `${formattedHours}:${minutes} ${ampm}`;
      }

      const greetingEl = document.getElementById('header-greeting');
      if (greetingEl) {
        if (hours < 12) greetingEl.innerText = 'GOOD MORNING';
        else if (hours < 18) greetingEl.innerText = 'GOOD AFTERNOON';
        else greetingEl.innerText = 'GOOD EVENING';
      }
    }

    function handleTileFocus(el) {
      if (!el) return;
      document.querySelectorAll('.tv-tile').forEach(tile => tile.classList.remove('active-focus'));
      el.classList.add('active-focus');

      const title = el.getAttribute('data-title') || 'App';
      const glow = el.getAttribute('data-glow') || 'rgba(59, 130, 246, 0.4)';

      const titleEl = document.getElementById('focused-app-title');
      if (titleEl) titleEl.innerText = title;

      const ambientEl = document.getElementById('ambient-glow');
      if (ambientEl) {
        ambientEl.style.background = `radial-gradient(ellipse at top, ${glow} 0%, rgba(8, 11, 17, 0) 70%)`;
      }
    }

    function updateFocusables() {
      focusableElements = Array.from(document.querySelectorAll('.tv-focusable, input, button'));
    }

    function setDashboardMode(mode) {
      currentMode = mode;
      const mediaBtn = document.getElementById('mode-media-btn');
      const dashBtn = document.getElementById('mode-dash-btn');
      const badge = document.getElementById('mode-badge');

      if (mode === 'media') {
        if (mediaBtn) mediaBtn.className = 'tv-focusable flex items-center space-x-2 px-5 py-2 rounded-full text-xs font-bold transition-all bg-white text-black shadow-lg';
        if (dashBtn) dashBtn.className = 'tv-focusable flex items-center space-x-2 px-5 py-2 rounded-full text-xs font-bold text-slate-400 hover:text-white transition-all';
        if (badge) badge.innerText = 'Media App';
      } else {
        if (dashBtn) dashBtn.className = 'tv-focusable flex items-center space-x-2 px-5 py-2 rounded-full text-xs font-bold transition-all bg-white text-black shadow-lg';
        if (mediaBtn) mediaBtn.className = 'tv-focusable flex items-center space-x-2 px-5 py-2 rounded-full text-xs font-bold text-slate-400 hover:text-white transition-all';
        if (badge) badge.innerText = 'Dashboard Tool';
      }

      renderAppGrid();
    }

    function toggleNetworkMode() {
      isEthernet = !isEthernet;
      const icon = document.getElementById('network-icon');
      const label = document.getElementById('network-label');

      if (isEthernet) {
        if (label) label.innerText = 'Ethernet';
        if (icon) {
          icon.setAttribute('data-lucide', 'cable');
          icon.className = 'w-4 h-4 text-emerald-400';
        }
      } else {
        if (label) label.innerText = 'Wi-Fi';
        if (icon) {
          icon.setAttribute('data-lucide', 'wifi');
          icon.className = 'w-4 h-4 text-cyan-400';
        }
      }
      if (window.lucide) lucide.createIcons();
    }

    function toggleHudModal() {
      const modal = document.getElementById('pi-hud-modal');
      if (modal) modal.classList.toggle('hidden');
    }

    function openAddModal() {
      const modal = document.getElementById('add-modal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeAddModal() {
      const modal = document.getElementById('add-modal');
      if (modal) modal.classList.add('hidden');
    }

    function handleSaveTile(e) {
      e.preventDefault();
      const name = document.getElementById('tile-name').value;
      const url = document.getElementById('tile-url').value;

      const newApp = {
        id: 'custom-' + Date.now(),
        name: name,
        url: url,
        glow: 'rgba(14, 165, 233, 0.55)',
        bgGradient: 'bg-gradient-to-b from-slate-800 to-slate-950',
        svg: `<svg viewBox="0 0 120 40" class="h-8 w-auto"><rect x="4" y="6" width="28" height="28" rx="6" fill="#0ea5e9"/><text x="38" y="26" fill="#FFF" font-weight="800" font-size="17" font-family="Arial, sans-serif">${name}</text></svg>`
      };

      if (currentMode === 'media') {
        MEDIA_APPS.push(newApp);
      } else {
        DASHBOARD_APPS.push(newApp);
      }
      
      closeAddModal();
      renderAppGrid();
    }

    function syncFromGithub() {
      const savedUrl = DEFAULT_GITHUB_RAW_URL;
      const syncIcon = document.getElementById('sync-icon');
      const syncLabel = document.getElementById('sync-label');

      try {
        if (syncLabel) syncLabel.innerText = 'Pulling...';
        if (syncIcon) syncIcon.classList.add('animate-spin');

        fetch(`${savedUrl}?t=${Date.now()}`)
          .then(res => {
            if (!res.ok) throw new Error(`HTTP error ${res.status}`);
            return res.text();
          })
          .then(newHtml => {
            document.open();
            document.write(newHtml);
            document.close();
          })
          .catch(err => {
            console.error('Failed to sync from GitHub:', err);
            if (syncLabel) syncLabel.innerText = 'Sync Failed';
            if (syncIcon) syncIcon.classList.remove('animate-spin');
            setTimeout(() => {
              if (syncLabel) syncLabel.innerText = 'Sync GitHub';
            }, 3000);
          });
      } catch (err) {
        console.error('Sync error:', err);
      }
    }

    // Helper for mouse-only users to exit browser/kiosk mode or close window
    function exitKioskMode() {
      if (confirm('Do you want to close the browser or return to desktop?')) {
        try {
          window.close();
        } catch (e) {
          console.log('Window close restricted by browser');
        }
      }
    }

    function launchApp(url, name, e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (!url || url === '#') return;

      const playerApps = ['youtube.com', 'twitch.tv'];
      const usePlayer = playerApps.some(domain => url.includes(domain));

      if (usePlayer) {
        openAppPlayer(url, name);
      } else {
        window.location.href = url;
      }
    }

    function renderAppGrid() {
      const grid = document.getElementById('app-grid');
      if (!grid) return;
      grid.innerHTML = '';

      const activeApps = currentMode === 'media' ? MEDIA_APPS : DASHBOARD_APPS;

      activeApps.forEach((app) => {
        // Fallback for safe rendering if svg is missing
        const safeSvg = app.svg || `<svg viewBox="0 0 100 40" class="h-8 w-auto"><text x="10" y="25" fill="#FFF" font-weight="800" font-size="16">${app.name}</text></svg>`;

        const tileHTML = `
          <div onclick="launchApp('${app.url || '#'}', '${app.name}', event)" data-id="${app.id || 'app'}" data-title="${app.name}" data-glow="${app.glow || 'rgba(59,130,246,0.5)'}" 
             onfocus="handleTileFocus(this)" onmouseenter="handleTileFocus(this)" tabindex="0"
             class="tv-tile tv-focusable ${app.bgGradient || 'bg-slate-800'} glass-card rounded-2xl p-4 flex flex-col items-center justify-center h-28 cursor-pointer relative overflow-hidden group border border-white/10">
            
            <div class="z-10 flex items-center justify-center w-full px-2 pointer-events-none">
              ${safeSvg}
            </div>

            <button onclick="deleteApp('${app.id}', event)" class="absolute top-2 right-2 p-1 bg-black/60 hover:bg-rose-600 text-slate-300 hover:text-white rounded-md opacity-0 group-hover:opacity-100 transition z-20">
              <i data-lucide="x" class="w-3 h-3"></i>
            </button>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', tileHTML);
      });

      if (window.lucide) {
        try { lucide.createIcons(); } catch(e) {}
      }
      updateFocusables();

      const firstTile = grid.querySelector('.tv-tile');
      if (firstTile) handleTileFocus(firstTile);
    }

    function openAppPlayer(url, title) {
      const container = document.getElementById('app-player-container');
      const iframe = document.getElementById('app-iframe');
      const titleLabel = document.getElementById('player-app-title');
      const trigger = document.getElementById('mouse-back-trigger');

      if (titleLabel) titleLabel.innerText = title;

      if (url && url !== '#') {
        iframe.src = url;
        container.classList.remove('hidden');
        container.classList.add('flex');
        if (trigger) trigger.classList.remove('hidden');
      }
    }

    function closeAppPlayer() {
      const container = document.getElementById('app-player-container');
      const iframe = document.getElementById('app-iframe');
      const trigger = document.getElementById('mouse-back-trigger');

      if (iframe) iframe.src = '';
      if (container) {
        container.classList.add('hidden');
        container.classList.remove('flex');
      }
      if (trigger) trigger.classList.add('hidden');
    }

    function resetScreensaverTimer() {
      const screensaver = document.getElementById('screensaver');
      if (screensaver) screensaver.classList.add('hidden');

      clearTimeout(screensaverTimeout);
      screensaverTimeout = setTimeout(() => {
        if (screensaver) screensaver.classList.remove('hidden');
      }, 300000);
    }

    document.addEventListener('keydown', (e) => {
      resetScreensaverTimer();

      if (e.key === 'Escape' || e.key === 'Backspace') {
        closeAppPlayer();
        toggleHudModal();
        closeAddModal();
      }
    });

    document.addEventListener('mousemove', resetScreensaverTimer);

    window.onload = function() {
      initCanvasBackground();
      updateClock();
      setInterval(updateClock, 10000);
      renderAppGrid();
      resetScreensaverTimer();
    };
  </script>
</body>
</html>
